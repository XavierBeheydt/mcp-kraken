name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual re-run: `gh workflow run release.yml --ref vX.Y.Z`
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write  # for sigstore / provenance

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_latest: ${{ steps.ranking.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version from tag
        id: version
        run: |
          v="${GITHUB_REF#refs/tags/v}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v"

      - name: Determine if this tag is the highest semver release in the repo
        # Guards against the race when several release runs publish in
        # parallel: only the build for the newest non-prerelease tag is
        # allowed to push :latest and mark the GitHub Release as latest.
        id: ranking
        run: |
          current="${GITHUB_REF#refs/tags/}"
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                    | grep -vE '-' \
                    | sort -V \
                    | tail -1)
          if [ "$current" = "$highest" ]; then
            echo "is_latest=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "current=$current highest=$highest"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.ranking.outputs.is_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  fast-forward-main:
    # Fast-forward main to the tagged commit on dev. The tag must point to
    # a commit already on `dev`; otherwise the FF push fails and you need
    # to merge manually.
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF}"
          git merge --ff-only "${GITHUB_REF}" || {
            echo "::warning::main cannot be fast-forwarded to ${GITHUB_REF} — leave it for manual merge"
            exit 0
          }
          git push origin main

  github-release:
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
          # Only the build for the highest semver in the repo is allowed to
          # carry the "Latest release" badge. Setting `make_latest: legacy`
          # otherwise tells GitHub to use its default heuristic (most recent
          # publish), which loses the race when older tags publish after.
          make_latest: ${{ needs.publish-image.outputs.is_latest == 'true' && 'true' || 'false' }}
          name: v${{ needs.publish-image.outputs.version }}
          body: |
            Docker image:
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.publish-image.outputs.version }}
            ```
