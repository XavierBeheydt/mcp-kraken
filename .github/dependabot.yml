# Dependabot keeps three ecosystems up to date and surfaces CVE advisories
# as auto-merge-able PRs. CodeQL handles SAST in a separate workflow.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ----------------------------------------------------------------- Python
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - python
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Pin major upgrades to manual review — they tend to break APIs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --------------------------------------------------------- GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]

  # ------------------------------------------------------- Docker base image
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - docker
