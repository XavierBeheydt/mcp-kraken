[project]
name = "mcp-kraken"
description = "MCP server exposing the Kraken cryptocurrency exchange REST API over HTTP with bearer-token authentication."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Xavier Beheydt", email = "xavier.beheydt@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "kraken",
    "cryptocurrency",
    "exchange",
    "trading",
    "fastmcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",
    "python-kraken-sdk>=3.2.8",
    "rich>=13",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
mcp-kraken = "mcp_kraken.cli:main"

[project.urls]
Homepage = "https://github.com/XavierBeheydt/mcp-kraken"
Repository = "https://github.com/XavierBeheydt/mcp-kraken"
Issues = "https://github.com/XavierBeheydt/mcp-kraken/issues"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+local"

[tool.hatch.build.hooks.vcs]
version-file = "src/mcp_kraken/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kraken"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_kraken", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "ARG", # unused arguments
    "RET", # flake8-return
    "S",   # bandit
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function calls in defaults (used by typer/click)
    "TID252", # relative imports within a package are fine
    "RUF002", # docstring punctuation
    "S105",   # token prefix constant isn't a password
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG", "N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = false
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["src/mcp_kraken"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]
